name: GNOME 46 checks
on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin gjs gir1.2-adw-1 xvfb dbus-x11
      - run: make check pack && git diff --check
      - run: sh tests/run-native.sh
